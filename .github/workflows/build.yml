name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build Locus Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          
          # Pick latest Xcode 16.x if available, otherwise latest Xcode.app
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | tail -n 1 || true)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="/Applications/Xcode.app"
          fi
          
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "Available SDKs:"
          xcodebuild -showsdks

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen version

      - name: Generate Xcode Project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Locus.xcodeproj
          xcodegen generate --spec project.yml
          test -d Locus.xcodeproj
          echo "Generated Locus.xcodeproj successfully."

      - name: Run Unit Tests (Simulator)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme LocusTests \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            test || true

      - name: Build Unsigned iOS App
        shell: bash
        run: |
          set -o pipefail
          rm -rf build
          mkdir -p build
          
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build.log

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Locus.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Locus.app was not found at $APP_PATH"
            find build -name "*.app" -type d || true
            exit 1
          fi
          
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Locus.app
          
          rm -f Locus-unsigned.ipa
          /usr/bin/zip -qry Locus-unsigned.ipa Payload
          
          echo "IPA created successfully:"
          ls -lh Locus-unsigned.ipa

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Locus-unsigned-IPA
          path: Locus-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Locus-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

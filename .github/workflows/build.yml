name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: Build unsigned app
        run: |
          set -o pipefail

          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration "${{ inputs.build_configuration }}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Verify app
        run: |
          APP_PATH="build/Build/Products/${{ inputs.build_configuration }}-iphoneos/Locus.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Locus.app was not created."
            exit 1
          fi

          echo "Found:"
          ls -la "$APP_PATH"

      - name: Verify unsigned
        run: |
          APP_PATH="build/Build/Products/${{ inputs.build_configuration }}-iphoneos/Locus.app"

          echo "Checking code signature..."

          if codesign -dv "$APP_PATH" 2>&1 | grep -q "Authority="; then
            echo "ERROR: App appears to be signed."
            exit 1
          fi

          echo "No signing authority found."

      - name: Create IPA
        run: |
          APP_PATH="build/Build/Products/${{ inputs.build_configuration }}-iphoneos/Locus.app"

          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/Locus.app

          zip -qry LocusPlus-unsigned.ipa Payload

          echo "IPA created:"
          ls -lh LocusPlus-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocusPlus-unsigned
          path: LocusPlus-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore

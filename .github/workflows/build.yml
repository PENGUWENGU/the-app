name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build idevice FFI library
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "Vendor/idevice/libidevice_ffi.a" ]; then
            rustup target add aarch64-apple-ios
            git clone --depth 1 https://github.com/jkcoxson/idevice.git /tmp/idevice
            cd /tmp/idevice/ffi
            cargo build --release --target aarch64-apple-ios
            cd "$GITHUB_WORKSPACE"
            mkdir -p Vendor/idevice
            cp /tmp/idevice/target/aarch64-apple-ios/release/libidevice_ffi.a Vendor/idevice/libidevice_ffi.a
          fi

      - name: Install XcodeGen
        shell: bash
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        shell: bash
        run: |
          xcodegen generate --spec project.yml

      - name: Build iOS App
        shell: bash
        run: |
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Create IPA
        shell: bash
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Locus.app Payload/
          zip -qry Locus-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Locus-unsigned-IPA
          path: Locus-unsigned.ipa
          if-no-files-found: error

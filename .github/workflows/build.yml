name: Build Unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-unsigned-ipa:
    name: Build Locus unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          XCODE="/Applications/Xcode_26.6.app"
          if [ ! -d "$XCODE" ]; then
            echo "::error::Xcode 26.6 was not found at $XCODE"
            echo "Installed Xcode versions:"
            ls -1 /Applications | grep -E '^Xcode.*\.app$' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          echo "Xcode:"
          xcodebuild -version
          echo
          echo "iPhoneOS SDKs:"
          xcodebuild -showsdks | grep -i iphoneos
      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen version
      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Locus.xcodeproj
          xcodegen generate --spec project.yml
          test -d Locus.xcodeproj
      - name: Show build configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "Schemes:"
          xcodebuild \
            -project Locus.xcodeproj \
            -list
          echo
          echo "Project deployment target:"
          grep -n 'deploymentTarget\|IPHONEOS_DEPLOYMENT_TARGET\|xcodeVersion' project.yml || true
      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
      - name: Locate built app
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Locus.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Locus.app was not produced."
            echo
            echo "Release products:"
            find build/Build/Products -maxdepth 4 -type d -print || true
            exit 1
          fi
          echo "Found:"
          du -sh "$APP"
          echo "$APP"
      - name: Verify app is unsigned
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Locus.app"
          echo "Checking code signature..."
          if codesign -dvv "$APP" 2>&1 | grep -q "Authority="; then
            echo "::error::The application is signed."
            codesign -dvv "$APP" 2>&1 || true
            exit 1
          fi
          echo "No signing authority found."
      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Locus.app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/Locus.app
          rm -f LocusPlus-unsigned.ipa
          /usr/bin/zip \
            -qry \
            LocusPlus-unsigned.ipa \
            Payload
          test -f LocusPlus-unsigned.ipa
          echo "IPA created:"
          ls -lh LocusPlus-unsigned.ipa
      - name: Verify IPA contents
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/unzip -t LocusPlus-unsigned.ipa
          echo
          echo "IPA contents:"
          /usr/bin/unzip -l LocusPlus-unsigned.ipa | head -50
          echo
          echo "IPA verification passed."
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocusPlus-unsigned-IPA
          path: LocusPlus-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocusPlus-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

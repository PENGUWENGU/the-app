name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: |
          set -e

          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Find app
        run: |
          set -e

          echo "Searching for built apps..."

          find build -type d -name "*.app" -print

          APP_PATH=$(find build -type d -name "Locus.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No Locus.app found."
            exit 1
          fi

          echo "Found: $APP_PATH"

          echo "App size:"
          du -sh "$APP_PATH"

          echo "App contents:"
          find "$APP_PATH" -maxdepth 2 -type f | head -50

          echo "$APP_PATH" > app_path.txt

      - name: Create IPA
        run: |
          set -e

          APP_PATH=$(cat app_path.txt)

          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/Locus.app

          echo "Payload contents:"
          ls -lah Payload
          du -sh Payload/Locus.app

          rm -f LocusPlus-unsigned.ipa

          zip -r -9 LocusPlus-unsigned.ipa Payload

          echo "IPA created:"
          ls -lh LocusPlus-unsigned.ipa

          IPA_SIZE=$(stat -f%z LocusPlus-unsigned.ipa)

          if [ "$IPA_SIZE" -lt 1000000 ]; then
            echo "ERROR: IPA is suspiciously small: $IPA_SIZE bytes"
            exit 1
          fi

          echo "IPA looks valid."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocusPlus-unsigned
          path: LocusPlus-unsigned.ipa
          if-no-files-found: error

name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned IPA
        run: |
          set -e

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration "${{ inputs.configuration }}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build | tee build/build.log

      - name: Package IPA
        run: |
          set -e

          APP_PATH="build/Build/Products/${{ inputs.configuration }}-iphoneos/Locus.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Locus.app was not found."
            echo "Searching for it:"
            find build -name "Locus.app" -print
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/Locus.app

          cd build
          zip -r LocusPlus-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocusPlus-unsigned
          path: build/LocusPlus-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/build.log
          if-no-files-found: ignore

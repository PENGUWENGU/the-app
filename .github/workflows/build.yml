name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build Locus Unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Select Xcode Version
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanning available Xcode installations in /Applications:"
          ls -1d /Applications/Xcode*.app 2>/dev/null || true

          # Select newest available Xcode (prefer 26.x, then 16.x, then system default)
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            XCODE="/Applications/Xcode_26.6.app"
          elif [ -d "/Applications/Xcode_26.6.0.app" ]; then
            XCODE="/Applications/Xcode_26.6.0.app"
          elif ls -d /Applications/Xcode_26*.app 2>/dev/null; then
            XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          elif [ -d "/Applications/Xcode_16.4.app" ]; then
            XCODE="/Applications/Xcode_16.4.app"
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            XCODE="/Applications/Xcode_16.3.app"
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            XCODE="/Applications/Xcode_16.2.app"
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            XCODE="/Applications/Xcode_16.1.app"
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            XCODE="/Applications/Xcode_16.0.app"
          elif ls -d /Applications/Xcode_16*.app 2>/dev/null; then
            XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          elif [ -d "/Applications/Xcode.app" ]; then
            XCODE="/Applications/Xcode.app"
          else
            XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          fi

          echo "Configuring Xcode: $XCODE"
          sudo xcode-select -s "$XCODE"
          echo "Active Developer Directory: $(xcode-select -p)"
          xcodebuild -version
          echo
          echo "Installed iOS SDKs:"
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Setup XcodeGen (Optional Regeneration)
        shell: bash
        run: |
          set -eo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            echo "XcodeGen already available: $(xcodegen version)"
            xcodegen generate --spec project.yml || echo "XcodeGen warning: using committed Locus.xcodeproj"
          elif command -v brew >/dev/null 2>&1; then
            echo "Installing XcodeGen via Homebrew..."
            brew install xcodegen || true
            if command -v xcodegen >/dev/null 2>&1; then
              xcodegen generate --spec project.yml || echo "XcodeGen warning: using committed Locus.xcodeproj"
            fi
          fi
          test -d Locus.xcodeproj
          echo "Xcode project ready."

      - name: Clean build directory
        shell: bash
        run: |
          rm -rf build Payload *.ipa
          mkdir -p build

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -o pipefail
          CONFIG="${{ inputs.configuration || 'Release' }}"
          echo "Building Locus scheme in $CONFIG configuration..."

          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Locate and Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find build -name "Locus.app" -type d | head -n 1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::Locus.app was not produced by xcodebuild."
            echo "Listing build output:"
            find build -maxdepth 5 || true
            exit 1
          fi

          echo "Found Locus.app at: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/Locus.app

          rm -f LocusPlus-unsigned.ipa
          zip -qry LocusPlus-unsigned.ipa Payload
          test -f LocusPlus-unsigned.ipa
          echo "IPA created successfully:"
          ls -lh LocusPlus-unsigned.ipa

      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail
          unzip -t LocusPlus-unsigned.ipa
          echo "Verified IPA integrity."

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocusPlus-unsigned-IPA
          path: LocusPlus-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocusPlus-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
